<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập tài khoản - NHT Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        /* Biến màu thương hiệu */
        :root {
            --brand-gold: #C69B56;
            --brand-dark: #2b2b2b;
            --brand-gold-hover: #b08746;
            --bs-warning-rgb: 198, 155, 86; /* = --brand-gold */
        }

        /* Nền & chữ mặc định */
        body {
            background: linear-gradient(135deg, #e6e6e6, #c9c9c9);
            color: #f8f9fa;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Khung đăng nhập */
        .auth-card-large {
            background-color: var(--brand-dark);
            border: 1px solid rgba(198, 155, 86, 0.4);
            border-radius: 20px;
            border-top: 4px solid var(--brand-gold);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            max-width: 440px;
            width: 100%;
        }

        /* Nút vàng */
        .btn-gold {
            background-color: var(--brand-gold);
            color: #fff;
            font-weight: 700;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-gold:hover {
            background-color: var(--brand-gold-hover);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(198, 155, 86, 0.35);
        }

        /* Viền vàng khi focus ô nhập */
        .form-control:focus {
            border-color: var(--brand-gold);
            box-shadow: 0 0 0 0.25rem rgba(198, 155, 86, 0.25);
        }

        /* Link hover: vàng + gạch chân */
        .text-gold-hover:hover {
            color: var(--brand-gold) !important;
            text-decoration: underline !important;
        }

        /* Tab đang chọn dùng màu gold */
        #loginTab {
            --bs-nav-pills-link-active-bg: var(--brand-gold);
            --bs-nav-pills-link-active-color: #fff;
        }

        /* Nút đăng nhập mạng xã hội */
        .btn-social {
            border: 1px solid #444;
            color: #e0e0e0;
            background-color: #222;
            transition: all 0.2s;
        }

        .btn-social:hover {
            border-color: var(--brand-gold);
            color: var(--brand-gold);
            background-color: rgba(198, 155, 86, 0.1);
        }
    </style>
</head>

<body>

    <!-- KHUNG ĐĂNG NHẬP -->
    <main class="container py-3">
        <div class="row justify-content-center">
            <div class="col-12 d-flex justify-content-center">
                <div class="auth-card-large p-4">

                    <!-- LOGO THƯƠNG HIỆU -->
                    <div class="text-center mb-3">
                        <a href="index.html" class="text-decoration-none">
                            <h1 class="fw-bold text-warning mb-1" style="letter-spacing: 3px; font-size: 1.4rem;">NHT STORE
                            </h1>
                        </a>
                        <p class="text-white small text-uppercase mb-0">Đồng Hồ Chính Hãng • Đẳng Cấp Thụy Sỹ &amp; Nhật
                            Bản</p>
                    </div>

                    <!-- TIÊU ĐỀ TRANG -->
                    <h3 class="text-center fw-bold text-uppercase mb-3 fs-6" style="letter-spacing: 1px;">Đăng Nhập Tài
                        Khoản</h3>

                    <!-- TÙY CHỌN PHƯƠNG THỨC ĐĂNG NHẬP (TAB) -->
                    <ul class="nav nav-pills nav-justified mb-3 bg-dark p-1 rounded-3" id="loginTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active text-light fw-medium rounded-2 py-1 small" id="pwd-login-tab"
                                data-bs-toggle="pill" data-bs-target="#pwd-login" type="button" role="tab">Mật
                                Khẩu</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link text-light fw-medium rounded-2 py-1 small" id="otp-login-tab"
                                data-bs-toggle="pill" data-bs-target="#otp-login" type="button" role="tab">Mã OTP /
                                SMS</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="loginTabContent">

                        <!-- TAB 1: ĐĂNG NHẬP MẬT KHẨU -->
                        <div class="tab-pane fade show active" id="pwd-login" role="tabpanel">
                            <form action="index.html" method="GET">
                                <div class="mb-2">
                                    <label class="form-label text-uppercase small text-light fw-bold mb-1">Email hoặc Số
                                        điện thoại</label>
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text bg-light border-secondary text-secondary"><i
                                                class="bi bi-person-fill"></i></span>
                                        <input type="text"
                                            class="form-control form-control-sm bg-light text-dark border-secondary"
                                            placeholder="Nhập email hoặc SĐT của bạn" required>
                                    </div>
                                </div>

                                <div class="mb-2">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <label class="form-label text-uppercase small text-light fw-bold mb-0">Mật
                                            khẩu</label>
                                        <a href="#" class="small text-light text-decoration-none text-gold-hover">Quên
                                            mật khẩu?</a>
                                    </div>
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text bg-light border-secondary text-secondary"><i
                                                class="bi bi-lock-fill"></i></span>
                                        <input type="password"
                                            class="form-control form-control-sm bg-light text-dark border-secondary"
                                            placeholder="••••••••" required>
                                    </div>
                                </div>

                                <div class="form-check mb-3">
                                    <input class="form-check-input bg-dark border-secondary" type="checkbox"
                                        id="rememberMe" checked>
                                    <label class="form-check-label small text-white" for="rememberMe">Duy trì đăng nhập
                                        trên thiết bị này</label>
                                </div>

                                <button type="submit" class="btn btn-gold btn-sm w-100 py-2 text-uppercase">Đăng Nhập
                                    Ngay</button>
                            </form>
                        </div>

                        <!-- TAB 2: ĐĂNG NHẬP MÃ OTP -->
                        <div class="tab-pane fade" id="otp-login" role="tabpanel">
                            <form action="index.html" method="GET">
                                <div class="mb-2">
                                    <label class="form-label text-uppercase small text-white fw-bold mb-1">Số điện thoại
                                        nhận mã</label>
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text bg-light border-secondary text-secondary"><i
                                                class="bi bi-phone-fill"></i></span>
                                        <input type="tel"
                                            class="form-control form-control-sm bg-light text-dark border-secondary"
                                            placeholder="0901234567" required>
                                        <button class="btn btn-outline-warning text-warning border-secondary"
                                            type="button">Gửi Mã</button>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-uppercase small text-white fw-bold mb-1">Mã xác thực
                                        OTP (6 chữ số)</label>
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text bg-light border-secondary text-secondary"><i
                                                class="bi bi-shield-check"></i></span>
                                        <input type="text"
                                            class="form-control form-control-sm bg-light text-dark border-secondary"
                                            placeholder="123456" maxlength="6" required>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-gold btn-sm w-100 py-2 text-uppercase">Xác Nhận
                                    &amp; Đăng Nhập</button>
                            </form>
                        </div>

                    </div>

                    <!-- HOẶC ĐĂNG NHẬP MẠNG XÃ HỘI -->
                    <div class="position-relative text-center my-3">
                        <hr class="border-secondary m-0">
                        <span
                            class="position-absolute top-50 start-50 translate-middle px-3 small text-white text-nowrap"
                            style="background-color: var(--brand-dark);">Hoặc đăng nhập nhanh bằng</span>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <button
                                class="btn btn-social btn-sm w-100 d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-google text-danger"></i> Google
                            </button>
                        </div>
                        <div class="col-6">
                            <button
                                class="btn btn-social btn-sm w-100 d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-facebook text-primary"></i> Facebook
                            </button>
                        </div>
                    </div>

                    <!-- LINK CHUYỂN SANG ĐĂNG KÝ -->
                    <div class="text-center pt-2 border-top border-secondary border-opacity-25">
                        <span class="text-white small">Bạn chưa có tài khoản NHT Store?</span>
                        <a href="signup.html"
                            class="fw-bold text-warning text-decoration-none ms-1 text-gold-hover small">Đăng ký tài khoản
                            mới</a>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
