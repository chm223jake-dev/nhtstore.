<!DOCTYPE html>
    <html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Đăng ký tài khoản - NHT Store</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <style>
            /* Biến màu thương hiệu */
            :root {
                --brand-gold: #C69B56;
                --brand-dark: #2b2b2b;
                --brand-gold-hover: #b08746;
            --bs-warning-rgb: 198, 155, 86; /* = --brand-gold */
            }
            /* Nền & chữ mặc định*/
            body {
                background: linear-gradient(135deg, #e6e6e6, #c9c9c9);
                color: #f8f9fa;
                font-family: system-ui, -apple-system, sans-serif;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            /* Khung đăng ký */
            .auth-card-xlarge {
                background-color: var(--brand-dark);
                border: 1px solid rgba(198, 155, 86, 0.4);
                border-radius: 20px;
                border-top: 4px solid var(--brand-gold);
                box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
                max-width: 440px;
                width: 100%;
            }
            /* Nút vàng */
            .btn-gold {
                background-color: var(--brand-gold);
                color: #fff;
                font-weight: 700;
                border: none;
                transition: all 0.3s ease;
            }
            .btn-gold:hover {
                background-color: var(--brand-gold-hover);
                color: #fff;
                transform: translateY(-2px);
                box-shadow: 0 6px 14px rgba(198, 155, 86, 0.35);
            }
            /* Viền vàng khi focus ô nhập / chọn */
            .form-control:focus, .form-select:focus {
                border-color: var(--brand-gold);
                box-shadow: 0 0 0 0.25rem rgba(198, 155, 86, 0.25);
            }
            /* Link hover: vàng + gạch chân */
            .text-gold-hover:hover {
                color: var(--brand-gold) !important;
                text-decoration: underline !important;
            }
        </style>
    </head>
    <body>

        <!-- KHUNG ĐĂNG KÝ -->
        <main class="container py-3">
            <div class="row justify-content-center">
                <div class="col-12 d-flex justify-content-center">
                    <div class="auth-card-xlarge p-4">

                        <!-- LOGO THƯƠNG HIỆU -->
                        <div class="text-center mb-3">
                            <a href="index.html" class="text-decoration-none">
                                <h1 class="fw-bold text-warning mb-1" style="letter-spacing: 3px; font-size: 1.4rem;">NHT STORE</h1>
                            </a>
                            <p class="text-light small text-uppercase mb-0">Thành Viên VIP • Nhận Ưu Đãi Đặc Quyền</p>
                        </div>

                        <!-- TIÊU ĐỀ TRANG -->
                        <h3 class="text-center fw-bold text-uppercase mb-3 fs-6" style="letter-spacing: 1px;">Đăng Ký Thành Viên Mới</h3>

                        <!-- FORM ĐĂNG KÝ ĐẦY ĐỦ THÔNG TIN -->
                        <form action="login.html" method="GET">

                            <!-- 1. Họ tên -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label text-uppercase small text-white fw-bold">Họ và tên đầy đủ <span class="text-danger">*</span></label>
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text bg-light border-secondary text-secondary"><i class="bi bi-person-badge-fill"></i></span>
                                    <input type="text" class="form-control form-control-sm bg-light text-dark border-secondary" id="fullName" placeholder="Nguyễn Văn A" required>
                                </div>
                            </div>

                            <!-- 2. Hàng đôi: Email & Số điện thoại -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="signupEmail" class="form-label text-uppercase small text-white fw-bold">Email <span class="text-danger">*</span></label>
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text bg-light border-secondary text-secondary"><i class="bi bi-envelope-fill"></i></span>
                                        <input type="email" class="form-control form-control-sm bg-light text-dark border-secondary" id="signupEmail" placeholder="info@email.com" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="phoneNumber" class="form-label text-uppercase small text-white fw-bold">Số điện thoại <span class="text-danger">*</span></label>
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text bg-light border-secondary text-secondary"><i class="bi bi-telephone-fill"></i></span>
                                        <input type="tel" class="form-control form-control-sm bg-light text-dark border-secondary" id="phoneNumber" placeholder="0912345678" required>
                                    </div>
                                </div>
                            </div>

                            <!-- 3. Hàng đôi: Ngày sinh & Giới tính -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="birthDate" class="form-label text-uppercase small text-white fw-bold">Ngày sinh</label>
                                    <input type="date" class="form-control form-control-sm bg-light text-dark border-secondary" id="birthDate">
                                </div>
                                <div class="col-md-6">
                                    <label for="gender" class="form-label text-uppercase small text-white fw-bold">Giới tính</label>
                                    <select class="form-select form-select-sm bg-light text-dark border-secondary" id="gender">
                                        <option value="male" selected>Nam</option>
                                        <option value="female">Nữ</option>
                                        <option value="other">Khác</option>
                                    </select>
                                </div>
                            </div>

                            <!-- 4. Hàng đôi: Mật khẩu & Xác nhận Mật khẩu -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="signupPassword" class="form-label text-uppercase small text-white fw-bold">Mật khẩu <span class="text-danger">*</span></label>
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text bg-light border-secondary text-secondary"><i class="bi bi-lock-fill"></i></span>
                                        <input type="password" class="form-control form-control-sm bg-light text-dark border-secondary" id="signupPassword" placeholder="Tối thiểu 8 ký tự" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="confirmPassword" class="form-label text-uppercase small text-white fw-bold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text bg-light border-secondary text-secondary"><i class="bi bi-shield-lock-fill"></i></span>
                                        <input type="password" class="form-control form-control-sm bg-light text-dark border-secondary" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                                    </div>
                                </div>
                            </div>

                            <!-- 5. Tùy chọn đăng ký bản tin ưu đãi -->
                            <div class="form-check mb-2">
                                <input class="form-check-input bg-dark border-secondary" type="checkbox" id="newsletterCheck" checked>
                                <label class="form-check-label small text-white" for="newsletterCheck">
                                    Nhận thông báo khuyến mãi & BST đồng hồ giới hạn từ NHT Store qua Email/Zalo.
                                </label>
                            </div>

                            <!-- 6. Điều khoản bắt buộc -->
                            <div class="form-check mb-3">
                                <input class="form-check-input bg-dark border-secondary" type="checkbox" id="termsCheck" required>
                                <label class="form-check-label small text-white" for="termsCheck">
                                    Tôi đồng ý với <a href="#" class="text-warning text-decoration-none">Điều khoản sử dụng</a> và <a href="#" class="text-warning text-decoration-none">Chính sách bảo mật</a> của NHT Store.
                                </label>
                            </div>

                            <!-- NÚT ĐĂNG KÝ -->
                            <button type="submit" class="btn btn-gold btn-sm w-100 py-2 text-uppercase mb-3">Tạo Tài Khoản Thành Viên</button>
                        </form>

                        <!-- LINK CHUYỂN SANG ĐĂNG NHẬP -->
                        <div class="text-center pt-3 border-top border-secondary border-opacity-25">
                            <span class="text-white small">Đã có tài khoản NHT Store?</span>
                            <a href="login.html" class="fw-bold text-warning text-decoration-none ms-1 text-gold-hover small">Đăng nhập ngay</a>
                        </div>

                    </div>
                </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
    </html>
